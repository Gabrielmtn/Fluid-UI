<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixer UI Demo</title>
    <link rel="stylesheet" href="css/mixer-theme.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #606060;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .demo-container {
            max-width: 1200px;
            width: 100%;
        }
        
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>Mixer UI Components Demo</h1>
        
        <!-- Example 1: Basic Controller Box -->
        <div class="controllerBox">
            <h3 class="title">Master Volume</h3>
            <div class="box">
                <div class="radialSlider" id="volumeSlider"></div>
            </div>
        </div>
        
        <!-- Example 2: Multiple Controls -->
        <div class="controllerBox">
            <h3 class="title">Equalizer</h3>
            <div class="box">
                <div class="row center">
                    <div class="radialSlider" id="bassSlider"></div>
                    <div class="radialSlider" id="midSlider"></div>
                    <div class="radialSlider" id="trebleSlider"></div>
                </div>
            </div>
        </div>
        
        <!-- Example 3: Progress Slider -->
        <div class="controllerBox">
            <h3 class="title">Track Position</h3>
            <div class="box">
                <div class="progressSlider">
                    <span>0:00</span>
                    <input type="range" id="trackPos" min="0" max="100" value="30">
                    <span>3:45</span>
                </div>
            </div>
        </div>
        
        <!-- Example 4: Button Container -->
        <div class="controllerBox">
            <h3 class="title">Transport Controls</h3>
            <div class="box">
                <div class="buttonContainer">
                    <button title="Play">
                        <svg viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z" fill="currentColor"/>
                        </svg>
                    </button>
                    <button title="Pause">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" fill="currentColor"/>
                        </svg>
                    </button>
                    <button title="Stop">
                        <svg viewBox="0 0 24 24">
                            <rect x="6" y="6" width="12" height="12" fill="currentColor"/>
                        </svg>
                    </button>
                    <button title="Record" class="active">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="8" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Example 5: Toggle Switches -->
        <div class="controllerBox">
            <h3 class="title">Effects</h3>
            <div class="box">
                <div class="row center">
                    <div class="toggleContainer">
                        <div class="title">Reverb</div>
                        <input type="checkbox" id="toggle1" class="toggle">
                        <label for="toggle1"></label>
                    </div>
                    <div class="toggleContainer">
                        <div class="title">Delay</div>
                        <input type="checkbox" id="toggle2" class="toggle" checked>
                        <label for="toggle2"></label>
                    </div>
                    <div class="toggleContainer">
                        <div class="title">Chorus</div>
                        <input type="checkbox" id="toggle3" class="toggle">
                        <label for="toggle3"></label>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Example 6: Dot Display -->
        <div class="controllerBox">
            <h3 class="title">Tempo</h3>
            <div class="box">
                <div class="dotDisplay">120 BPM</div>
            </div>
        </div>
    </div>
    
    <script src="js/14-radial-slider.js"></script>
    <script>
        // Initialize radial sliders
        document.addEventListener('DOMContentLoaded', () => {
            // Volume slider
            new RadialSlider(document.getElementById('volumeSlider'), {
                min: 0,
                max: 100,
                value: 75,
                step: 1,
                label: 'Volume',
                format: (val) => `${val}%`,
                onChange: (val) => console.log('Volume:', val)
            });
            
            // EQ sliders
            new RadialSlider(document.getElementById('bassSlider'), {
                min: -12,
                max: 12,
                value: 0,
                step: 0.5,
                label: 'Bass',
                decimals: 1,
                format: (val) => `${val > 0 ? '+' : ''}${val.toFixed(1)}`,
                onChange: (val) => console.log('Bass:', val)
            });
            
            new RadialSlider(document.getElementById('midSlider'), {
                min: -12,
                max: 12,
                value: 2,
                step: 0.5,
                label: 'Mid',
                decimals: 1,
                format: (val) => `${val > 0 ? '+' : ''}${val.toFixed(1)}`,
                onChange: (val) => console.log('Mid:', val)
            });
            
            new RadialSlider(document.getElementById('trebleSlider'), {
                min: -12,
                max: 12,
                value: -1,
                step: 0.5,
                label: 'Treble',
                decimals: 1,
                format: (val) => `${val > 0 ? '+' : ''}${val.toFixed(1)}`,
                onChange: (val) => console.log('Treble:', val)
            });
            
            // Progress slider update
            const trackPos = document.getElementById('trackPos');
            trackPos.addEventListener('input', (e) => {
                const percent = (e.target.value / e.target.max) * 100;
                e.target.style.setProperty('--progress-percent', `${percent}%`);
            });
            trackPos.dispatchEvent(new Event('input'));
        });
    </script>
</body>
</html>
